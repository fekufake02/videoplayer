<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E202B"/>
      <stop offset="50%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Subtle Rim Glow -->
  <rect x="27" y="27" width="458" height="458" rx="109" fill="none" stroke="rgba(129,140,248,0.2)" stroke-width="2"/>

  <!-- Shield Outer Glow -->
  <path d="M 256 100 L 370 148 C 370 270 320 360 256 408 C 192 360 142 270 142 148 Z" fill="none" stroke="url(#glowGrad)" stroke-width="28" filter="url(#neonGlow)"/>

  <!-- Shield Metallic Body -->
  <path d="M 256 112 L 360 156 C 360 264 314 348 256 392 C 198 348 152 264 152 156 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="20" stroke-linejoin="round"/>

  <!-- Inner Vault Chamber Core -->
  <path d="M 256 142 L 334 176 C 334 252 298 316 256 352 C 214 316 178 252 178 176 Z" fill="#0C0E14" stroke="rgba(129,140,248,0.3)" stroke-width="4"/>

  <!-- Centered Play Glyph -->
  <polygon points="236,214 300,256 236,298" fill="#FFFFFF"/>
</svg>
